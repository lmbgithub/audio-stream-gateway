[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-stream-gateway"
version = "0.1.0"
description = "Real-time WebSocket gateway for streaming speech recognition, with latency instrumentation and backpressure"
readme = "README.md"
authors = [{ name = "Luis Manuel Barrios", email = "lmb.office@gmail.com" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["asr", "websocket", "streaming", "fastapi", "speech-to-text", "latency"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
audio-stream-gateway = "gateway.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
