name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  smoke:
    # Boots the real server and drives it with the demo client, so the packaged
    # entry point and the ASGI wiring are exercised, not only the unit tests.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" websockets

      - name: Start the gateway
        run: |
          uvicorn gateway.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 1
          done

      - name: Stream a session
        run: python client/demo_client.py --seconds 2

      - name: Check metrics were recorded
        run: |
          curl -sf http://127.0.0.1:8000/metrics | tee metrics.txt
          grep -q "gateway_sessions_started_total 1" metrics.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t audio-stream-gateway:ci .
      - name: Boot and health-check the container
        run: |
          docker run -d --name gw -p 8000:8000 audio-stream-gateway:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs gw
          exit 1
